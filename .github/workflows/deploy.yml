name: Deploy Astro Blog

on:
  push:
    branches:
      - prod

env:
  IMAGE_NAME: astro-blog-nginx
  CONTAINER_NAME: blog-fadharpra

jobs:
  check-code:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Validate repo files
        run: |
          test -f Dockerfile
          echo "OK: Dockerfile exists"

  build-and-push-docker:
    runs-on: ubuntu-latest
    needs: check-code
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:prod

  deploy-to-server:
    runs-on: ubuntu-latest
    needs: build-and-push-docker
    steps:
      - name: SSH to server & Deploy
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:prod
            docker rm -f ${{ env.CONTAINER_NAME }} || true
            docker run -d --restart always --name ${{ env.CONTAINER_NAME }} -p 8080:80 \
              ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:prod

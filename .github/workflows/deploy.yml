name: Deploy Astro Blog

on:
  push:
    branches:
      - prod

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/astro-blog-nginx:prod
  CONTAINER_NAME: blog-fadharpra

jobs:
  check-code:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 18
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build Check (Dry Run)
        run: npm run build

  build-and-push-docker:
    runs-on: ubuntu-latest
    needs: check-code
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ env.IMAGE_NAME }}

  deploy-to-server:
    runs-on: ubuntu-latest
    needs: build-and-push-docker
    steps:
      - name: SSH to server & Deploy
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            docker pull ${{ env.IMAGE_NAME }}
            docker rm -f ${{ env.CONTAINER_NAME }} || true
            docker run -d --restart always --name ${{ env.CONTAINER_NAME }} -p 8080:80 \
              ${{ env.IMAGE_NAME }}
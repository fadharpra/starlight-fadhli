name: Deploy Astro Blog (After Build)

on:
  workflow_run:
    workflows: ["Build & Push Astro Blog Image"]
    types:
      - completed

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: astro-blog-nginx
      CONTAINER_NAME: blog-fadharpra

    steps:
      - name: SSH to server & Deploy
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:prod
            docker rm -f ${{ env.CONTAINER_NAME }} || true
            docker run -d --restart always --name ${{ env.CONTAINER_NAME }} -p 8080:80 \
              ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:prod
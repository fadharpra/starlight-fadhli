events {}

http {
  include       mime.types;
  default_type  application/octet-stream;

  # Detect preferred language from browser header
  map $http_accept_language $preferred_lang {
    default id;
    ~*en en;
    ~*id id;
  }

  server {
    listen 80;
    server_name _;

    root /var/www/html;
    index index.html;

    # Redirect only the root URL to /id/ or /en/ based on Accept-Language
    location = / {
      return 302 /$preferred_lang/;
    }

    location / {
      try_files $uri $uri/ =404;
    }
  }
}
